<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMING SOON</title>
    <style>
        :root {
            --mars-red: #ff2a00;
            --mars-glow: #ff4500;
            --deep-space: #050202;
            --crimson-dark: #120303;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--deep-space);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Radial Martian atmosphere background glow */
        .background-glow {
            position: absolute;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, var(--crimson-dark) 0%, var(--deep-space) 70%);
            z-index: 1;
        }

        /* Pulsing energy core */
        .mars-core {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--mars-red) 0%, transparent 70%);
            opacity: 0.15;
            filter: blur(40px);
            z-index: 2;
            animation: pulse 4s ease-in-out infinite alternate;
        }

        /* Content Container */
        .container {
            position: relative;
            z-index: 3;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: clamp(2.5rem, 8vw, 6rem);
            font-weight: 900;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 
                0 0 10px rgba(255, 42, 0, 0.8),
                0 0 25px rgba(255, 42, 0, 0.6),
                0 0 50px rgba(255, 42, 0, 0.4);
            margin-right: -0.35em; /* Optical alignment offset for letter-spacing */
            animation: intensityGlow 2.5s ease-in-out infinite alternate;
        }

        /* Minimalist aggressive divider */
        .line {
            width: 80px;
            height: 3px;
            background: var(--mars-red);
            margin: 25px auto 0;
            box-shadow: 0 0 12px var(--mars-glow);
        }

        @keyframes pulse {
            0% {
                transform: scale(0.9);
                opacity: 0.12;
            }
            100% {
                transform: scale(1.3);
                opacity: 0.25;
            }
        }

        @keyframes intensityGlow {
            0% {
                text-shadow: 
                    0 0 10px rgba(255, 42, 0, 0.7),
                    0 0 20px rgba(255, 42, 0, 0.4);
            }
            100% {
                text-shadow: 
                    0 0 15px rgba(255, 69, 0, 1),
                    0 0 35px rgba(255, 42, 0, 0.8),
                    0 0 60px rgba(255, 0, 0, 0.6);
            }
        }
    </style>
</head>
<body>

    <div class="background-glow"></div>
    <div class="mars-core"></div>

    <div class="container">
        <h1>COMING SOON</h1>
        <div class="line"></div>
    </div>

</body>
</html>
